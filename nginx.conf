server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index pages/index.html;

    # หน้าแรก redirect ไป pages/index.html
    location = / {
        return 301 /pages/index.html;
    }

    # serve static files (405 = allow POST on static pages for search form)
    error_page 405 =200 $uri;
    location / {
        try_files $uri $uri/ =404;
    }

    # cache assets
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location /css/ {
        expires 7d;
        add_header Cache-Control "public";
    }
}
